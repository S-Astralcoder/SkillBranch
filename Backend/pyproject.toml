[project]
name = "Skill-Branch"
version = "0.1.0"
description = "This is a web based application where you can track your skills in a structured way"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.139.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
]


[tool.fastapi]
entrypoint = "app.app:app"
