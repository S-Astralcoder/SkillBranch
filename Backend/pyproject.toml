[project]
name = "Skill-Branch"
version = "0.1.0"
description = "This is a web based application where you can track your skills in a structured way"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.139.2",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt[crypto]>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
]


[tool.fastapi]
entrypoint = "app.app:app"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]


[tool.pyright]
typeCheckingMode = "basic"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.ruff]
exclude =["tests"]
