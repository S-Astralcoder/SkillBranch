<html lang="en">

    <meta name="description", content="Website to track personal skill progress">
    <title>SkillBranch</title>


    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/register.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Rye&family=Solway:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Roboto+Slab:wght@100..900&family=Rye&family=Solway:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Roboto+Slab:wght@100..900&family=Rye&family=Solway:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <script src="https://kit.fontawesome.com/fd488fa74c.js" crossorigin="anonymous"></script>

    <script src="../js/home.js" defer></script>
</head>
<body>
    <header id="page-header" class="flex-between header-style header-bottom-line static-element">
        <section id="logo" class="logo">
            <a id="home-page-link"><span id="skill-text">Skill</span><span id="branch-text">Branch</span></a>
        </section>
        <nav id="navigation" class="nav">
            <a href="../index.html" class="text-hover" >Home</a>
            <a href="./login.html" class="text-hover">Login</a>
            <a href="./signup.html" class="text-hover" style="text-decoration: underline;">Signup</a>
            <a href="./about_us.html" class="text-hover">About us</a>
        </nav>
        <nav id="mobile-naviagtion" class="mob-nav">
            <button class="mob-nav-btn"><i class="fa-solid fa-ellipsis fa-2xl"></i></button>
        </nav>
        <aside id="side-menu" class="side-menu">
            <a href="../index.html" class="text-hover" >Home</a>
            <a href="./login.html" class="text-hover">Login</a>
            <a href="./signup.html" class="text-hover" style="text-decoration: underline;">Signup</a>
            <a href="./about_us.html" class="text-hover">About us</a>
        </aside>
    </header>
    <main id="home-page-content" class="center-content content-container">
        <h2 id="invite-call">Keep Your Skill Development Organized</h2>
        <form action="" id="signup-form" class="form">
            <h3 id="form-header">Sign Up to SkillBranch</h3>
            <div id="form-content-container">    

                <div id="name-box">
                    <label for="name">Username</label>
                    <input type="text" id="name">
                </div>

                <div id="email-box">
                    <label for="email">Email</label>
                    <input type="text" id="email">
                </div>
                <div id="password-box">
                    <label for="password">Password</label>
                    <div id="password-input-container">
                        <input type="password" name="password">
                        <button id="show-password" type="button"><i class="fa-solid fa-eye-slash"></i></button>
                    </div>
                    </div>
                <button type="submit" id="submit-btn" class="submit-btn">SignUp</button>
            </div>
        </form>
    </main>
    
</body>
</html>
